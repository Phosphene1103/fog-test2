name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: 安装 Cordova
      run: npm install -g cordova@latest

    - name: 创建项目
      run: |
        cordova create android-app com.eco.airmonitor fogtest2
        cp index.html android-app/www/
        cp config.xml android-app/

    - name: 构建 APK
      working-directory: ./android-app
      run: |
        cordova platform add android
        cordova build android

    - name: 上传 APK (v4 语法)
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android-app/platforms/android/**/*.apk
        retention-days: 3  # 自动保留3天
