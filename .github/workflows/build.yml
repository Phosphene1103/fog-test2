name: Build APK
on: [push]

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Java 11
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: 设置 Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: 安装 Cordova
      run: npm install -g cordova@latest

    - name: 创建项目结构
      run: |
        cordova create android-app com.eco.airmonitor fogtest2
        cp index.html android-app/www/
        cp config.xml android-app/

    - name: 添加 Android 平台
      working-directory: ./android-app
      run: cordova platform add android@12.0.0

    - name: 接受 Android 许可
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: 构建 APK
      working-directory: ./android-app
      run: cordova build android

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          android-app/platforms/android/app/build/outputs/apk/**/*.apk
        retention-days: 3
