name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: 安装 Cordova
      run: npm install -g cordova@latest

    - name: 创建项目结构
      run: |
        cordova create android-app com.eco.airmonitor fogtest2
        cp index.html android-app/www/
        cp config.xml android-app/

    - name: 添加 Android 平台
      working-directory: ./android-app
      run: |
        cordova platform add android@latest

    - name: 接受 Android 许可
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: 构建 APK
      working-directory: ./android-app
      run: cordova build android

    - name: 上传 APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: android-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
